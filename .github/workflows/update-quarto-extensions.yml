name: Update Quarto Extensions

on:
  schedule:
    - cron: '0 10 * * 1' # every Monday at 10:00 UTC
  workflow_dispatch:

jobs:
  update-extensions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b #v2

      - name: Update extensions
        run: |
          quarto update extension gadenbuie/quarto-partials --no-prompt
          quarto update extension quarto-ext/fontawesome --no-prompt

      - name: Open pull request if extensions changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to extensions, skipping PR."
            exit 0
          fi

          BRANCH="automated/update-quarto-extensions"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: update Quarto extensions"
          git push --force origin "$BRANCH"

          if gh pr list --head "$BRANCH" --state open | grep -q "$BRANCH"; then
            echo "PR already open for $BRANCH, skipping creation."
          else
            gh pr create \
              --title "chore: update Quarto extensions" \
              --body "$(cat <<'EOF'
          Automated weekly update of Quarto extensions.

          Extensions updated:
          - \`gadenbuie/partials\`
          - \`quarto-ext/fontawesome\`

          The render test in the publish workflow will verify these changes work correctly.
          EOF
          )" \
              --base main \
              --head "$BRANCH"
          fi
