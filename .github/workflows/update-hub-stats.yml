name: Update Hub Stats

on:
  schedule:
    - cron: '0 12 * * 1' # every Monday at 12:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-fetch all hubs regardless of cached pushed_at timestamps'
        required: false
        default: 'false'
        type: boolean

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install -r requirements/requirements.txt

      - name: Install YQ
        env:
          VERSION: v4.45.1
          BINARY: yq_linux_amd64
        run: |
          wget https://github.com/mikefarah/yq/releases/download/${VERSION}/${BINARY}.tar.gz -O - |\
          tar xz && sudo mv ${BINARY} /usr/bin/yq

      - name: Update hub list
        run: python scripts/print_hub_list.py

      - name: Update hub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/get_hub_stats.py $FORCE_FLAG

      - name: Check for hub stat regressions
        id: hub_check
        run: |
          python scripts/check_hub_stats.py
          if [ -s output/hub_stats_warnings.md ]; then
            echo "has_warnings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_warnings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with updated data files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA_FILES="output/hubs.json output/active-hubs-table.csv output/hub_stats_summary.csv output/hub_stats/"
          if [ -z "$(git status --porcelain $DATA_FILES)" ]; then
            echo "No changes to data files, skipping PR."
            exit 0
          fi

          BRANCH="chore/update-hub-stats"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add $DATA_FILES
          git commit -m "chore: update hub data files"
          git push --force origin "$BRANCH"

          if gh pr list --head "$BRANCH" --state open | grep -q "$BRANCH"; then
            echo "PR already open for $BRANCH, skipping creation."
          else
            gh pr create \
              --title "chore: update hub data files" \
              --body "Automated weekly update of hub data files.

          - \`output/hubs.json\`
          - \`output/active-hubs-table.csv\`
          - \`output/hub_stats_summary.csv\`
          - \`output/hub_stats/\` (per-hub parquet cache + fetch_cache.json)

          Once merged, the site will be re-rendered and published automatically by the Quarto Publish workflow." \
              --base main \
              --head "$BRANCH"
          fi

      - name: Comment on PR with regression warnings
        if: steps.hub_check.outputs.has_warnings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-hub-stats"
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file output/hub_stats_warnings.md
          fi
