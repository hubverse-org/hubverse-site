name: Update Hub Stats

on:
  schedule:
    - cron: '0 12 * * 1' # every Monday at 12:00 UTC
  workflow_dispatch:

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b #v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install -r requirements/requirements.txt

      - name: Install YQ
        env:
          VERSION: v4.45.1
          BINARY: yq_linux_amd64
        run: |
          wget https://github.com/mikefarah/yq/releases/download/${VERSION}/${BINARY}.tar.gz -O - |\
          tar xz && sudo mv ${BINARY} /usr/bin/yq

      - name: Update hub list
        run: python scripts/print_hub_list.py

      - name: Update hub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/get_hub_stats.py

      - name: Generate other site content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make contributors
          make models
          make terminology
          make cite

      - name: Commit updated data files
        run: |
          DATA_FILES="output/hubs.json output/active-hubs-table.csv output/hub_stats_summary.csv"
          if [ -z "$(git status --porcelain $DATA_FILES)" ]; then
            echo "No changes to data files, skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $DATA_FILES
            git commit -m "chore: update hub data files [skip ci]"
            git push origin main
          fi

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b #v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
