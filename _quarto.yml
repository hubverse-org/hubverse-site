project:
  type: website
  resources:
    - docs-redirect.html
website:
  announcement:
    icon: baloon #megaphone
    dismissable: true
    content: "Welcome to the new hubverse site. If you have any comments, feel free to [provide feedback](https://github.com/hubverse-org/hubverse-site/issues/new)"
    type: info
    position: above-navbar
  favicon: /brand/logo/logo.png
  title: "hubverse"
  site-url: "https://hubverse.io"
  repo-url: "https://github.com/hubverse-org/hubverse-site"
  repo-actions: [edit, source, issue]
  navbar:
    search: true
    right:
      - text: "Home"
        href: index.qmd
      - text: "**Get Started**"
        menu:
        - icon: question-circle
          href: quickstart/index.qmd
        - icon: diagram-3
          href: quickstart/create.qmd
        - icon: file-earmark-arrow-up
          href: quickstart/submit.qmd
        - icon: graph-up
          href: quickstart/analyze.qmd
        - icon: braces
          href: quickstart/develop.qmd
        - "---"
        - icon: headset
          text: "Consulting Support"
          href: quickstart/support-consulting.md
      - text: "Tools"
        menu:
        - text: "Data Standards"
          icon: compass
          href: tools/data.qmd
        - text: "Software"
          icon: tools
          href: tools/software.qmd
        - text: "Dashboards"
          icon: speedometer
          href: tools/dashboards.qmd
      - text: "Community"
        menu:
        - text: "{{< fa people-line >}} &nbsp;Community"
          href: community/index.qmd
        - text: "{{< fa list >}} &nbsp;&nbsp;List of hubs"
          href: "community/hubs.qmd"
        - text: "{{< fa pencil >}} &nbsp;&nbsp;Contributors"
          href: community/contributors.md
        - text: "{{< fa address-card >}} &nbsp;&nbsp;Contact"
          href: "contact.qmd"
        - text: "---"
        - icon: info-circle-fill
          href: "about.qmd"
      - text: "Resources"
        menu:
        - icon: book
          text: "Terminology"
          href: "terminology.qmd"
        - text: "{{< fa book >}} &nbsp;&nbsp;Documentation {{< fa arrow-up-right-from-square >}}"
          href: https://docs.hubverse.io/
        - text: "{{< fa coins >}} &nbsp;&nbsp;Funding"
          href: "funding.md"
        - text: "{{< fa user-graduate >}} &nbsp;Research & Talks"
          href: "researchtalks.md"
        - text: "{{< fa laptop-code >}} &nbsp;Trainings"
          href: "trainings.md"
        - text: "{{< fa quote-left >}} &nbsp;&nbsp;How to cite"
          href: "cite.qmd"
        - icon: github
          text: "Contributing to the site"
          href: "CONTRIBUTING.md"
        - "---"
        - icon: headset
          text: "Consulting Support"
          href: quickstart/support-consulting.md
  page-footer:
    left:
      - icon: c-circle
        text: "Copyright 2025, Collaborative Modelling Consortium"
    right:
      - href: funding.md
      - href: contact.qmd
      - href: about.qmd
format:
  html:
    anchor-sections: true
    link-external-icon: true
    breadcrumbs: true
    theme:
      light:
        - litera
        - includes/poppins.scss
    css: styles.css
    toc: true
    includes:
      before-body: docs-redirect.html
brand: brand/_brand.yml
resources:
 - includes/

