<script>
  const path = window.location.pathname;
  const isDev = window.location.hostname === "localhost";

  // Use console.log for debugging:
  // console.log("🔍 docs-redirect script loaded");
  // console.log("🚧 Current path:", path);

  const redirects = {
    "overview/history.html": "https://hubverse.io/about.html#history",
    "overview/contributors.html": "https://hubverse.io/community/contributors.html",
    "overview/contribute.html": "https://hubverse.io/community/",
    "overview/who-we-are.html": "https://hubverse.io/about.html",
    "overview/scope.html": "https://hubverse.io/about.html#scope",
    "overview/support-consulting.html": "https://hubverse.io/quickstart/support-consulting.html",
    "overview/data-storage.html": "https://docs.hubverse.io/en/latest/user-guide/data-storage.html",
    "user-guide/presentations.html": "https://hubverse.io/researchtalks.html"
  };

  const versionedPathRegex = /^\/en\/(\d+\.\d+\.\d+|latest|stable)\//;
  const isVersionedPath = versionedPathRegex.test(path);
  const isLatestOrStable = path.startsWith("/en/latest") || path.startsWith("/en/stable");

  let redirected = false;

  if (isDev || isVersionedPath) {
    if (isLatestOrStable) {
      for (const [key, url] of Object.entries(redirects)) {
        if (path.includes(key)) {
          // console.log("🔀 Redirecting to:", url);
          window.location.href = url;
          redirected = true;
          break;
        }
      }
    }
  }

  if (!redirected && isVersionedPath) {
    const fallback = "https://docs.hubverse.io" + path;
    // console.log("🔀 Redirecting to fallback docs:", fallback);
    window.location.href = fallback;
  }
</script>
